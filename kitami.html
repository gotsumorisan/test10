<script src="./machine-strategy-v315.js"></script></head><body class="v2-redirect"><a href="./stores.html#kitami">北見店舗一覧を開く</a><script id="pwa-register-v38">if('serviceWorker'in navigator&&location.protocol!=='file:'){addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>reg.update().catch(()=>{})).catch(()=>{})},{once:true})}</script><script id="a11y-state-v310">(()=>{

})();</script><script src="./hallscan-v315.js"></script></body></html>
